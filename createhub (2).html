<title>CreateHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: dark studio floor under the logo's own black. Left-aligned hero with the logo orb as the single large image,
   then quiet surfaces. Violet to coral gradient is reserved for primary actions and the latest bar in charts. */
:root{
  --bg:#0e0e10; --surface:#151518; --surface-2:#1c1c21; --line:#2a2a31;
  --fg:#f4f2fa; --muted:#a29faf;
  --violet:#8b5cf6; --periwinkle:#7b8cff; --coral:#ff9a7a; --pink:#ee7bc0; --cyan:#27d3ee;
  --ok:#4ade80; --err:#ff8a8a; --bar:#3a3a4a;
  --grad:linear-gradient(110deg,#8b5cf6,#ee7bc0 58%,#ff9a7a);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{--gutter:clamp(16px,4vw,40px);background:var(--bg);color:var(--fg);font:15px/1.55 var(--f-body);padding-inline:var(--gutter);min-height:100%}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * var(--gutter));padding-inline:var(--gutter);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;border-radius:12px}
.brand .orb{width:40px;height:auto;border-radius:10px}
.brand .word{height:32px;width:auto;border-radius:10px}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nav .navbtn{padding:.45rem .8rem;border-radius:999px;color:var(--muted);font-weight:500}
.nav .navbtn:hover{color:var(--fg);background:var(--surface-2)}
.nav .count{display:inline-block;min-width:1.3rem;padding:0 .35rem;margin-left:.3rem;border-radius:999px;background:var(--violet);color:#0e0e10;font-size:.75rem;font-weight:600;text-align:center}
.chip-user{display:flex;align-items:center;gap:8px;padding:.25rem .7rem .25rem .3rem;border-radius:999px;background:var(--surface-2);font-size:.85rem}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#120d1c;display:grid;place-items:center;font:700 .8rem var(--f-display)}

/* shell */
.app{max-width:1120px;margin:0 auto;padding-block:28px 72px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:18px;padding:.3rem .5rem .3rem 0;font-weight:500}
.back:hover{color:var(--fg)}
.eyebrow{font:500 .75rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.page-head{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.page-head h1{font-size:clamp(1.7rem,3.6vw,2.4rem)}
.page-head p{color:var(--muted);max-width:60ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.1rem;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;transition:border-color .15s,transform .15s}
.btn:hover{border-color:var(--periwinkle)}
.btn.primary{background:var(--grad);color:#120d1c;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:.4rem .75rem;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{color:var(--periwinkle);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--cyan)}

/* landing */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(24px,5vw,64px);align-items:center;padding-block:clamp(8px,4vw,40px)}
.hero-copy{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero h1{font-size:clamp(2.3rem,5.4vw,3.9rem);line-height:1.02}
.hero .lede{color:var(--muted);font-size:1.08rem;max-width:46ch}
.hero-art{display:grid;place-items:center;min-width:0}
.hero-art img{width:min(100%,400px);height:auto;mix-blend-mode:screen;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent);animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:6px}
.role{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:1.1rem 1.1rem 1.2rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.role:hover{border-color:var(--violet);transform:translateY(-2px)}
.role strong{font:700 1.1rem var(--f-display)}
.role span{color:var(--muted);font-size:.9rem}
.stepbox{margin-top:6px;padding:1.2rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.stepbox h2{font-size:1.25rem}
.stepbox .opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* forms */
.formcard{max-width:520px;padding:clamp(18px,3vw,28px);border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
.field textarea{resize:vertical;min-height:96px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--periwinkle);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--periwinkle) 28%,transparent)}
.err{color:var(--err);font-size:.9rem;min-height:1.2em}
.hint{font-size:.85rem;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo{padding:.7rem .9rem;border-radius:10px;border:1px dashed var(--line);font-size:.85rem;color:var(--muted);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;padding:1.25rem;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .2s;min-width:0}
.tile:hover{border-color:var(--violet);transform:translateY(-2px)}
.tile .iw{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--periwinkle)}
.tile h3{font-size:1.2rem}
.tile p{color:var(--muted);font-size:.92rem}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:500 1.5rem var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

/* explore */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1 1 260px;min-width:0;padding:.7rem .9rem;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.search:focus{border-color:var(--periwinkle);outline:none}
.sel{padding:.7rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:.4rem .85rem;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:.9rem}
.chip:hover{color:var(--fg);border-color:var(--periwinkle)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:18px}
.wcard{display:flex;flex-direction:column;gap:10px;min-width:0}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:var(--surface);border:1px solid var(--line);transition:border-color .2s}
.thumb:hover{border-color:var(--periwinkle)}
.art{display:block;width:100%;height:100%;object-fit:cover;max-width:100%}
.vbadge{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;padding:.15rem .5rem;border-radius:999px;background:rgba(14,14,16,.78);font-size:.75rem;font-weight:600;color:var(--fg)}
.vbadge .ic{width:12px;height:12px;fill:currentColor;stroke:none}
.wmeta{display:flex;flex-direction:column;gap:2px}
.wmeta h3{font:600 1rem var(--f-body);letter-spacing:0}
.by{font-size:.85rem;color:var(--muted)}
.by .link{color:var(--muted);text-decoration:none}
.by .link:hover{color:var(--cyan)}
.wrow{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.rate{font-size:.85rem;color:var(--coral)}
.price{font-weight:500}
.empty{padding:36px 20px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,4vw,40px);align-items:start}
.stage{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);aspect-ratio:16/10}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.side h1{font-size:clamp(1.5rem,3vw,2.1rem)}
.tag{display:inline-block;padding:.15rem .6rem;border-radius:999px;background:var(--surface-2);font-size:.78rem;color:var(--muted)}
.bigprice{font:500 1.9rem var(--f-mono)}
.sect{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:clamp(20px,4vw,40px)}
.sect h2{font-size:1.3rem;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:14px}
.msg{padding:.85rem 1rem;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.msg .who{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted)}
.msg .who b{color:var(--fg);font-weight:600}
.stars{display:flex;gap:2px}
.stars button{font-size:1.6rem;line-height:1;color:var(--line)}
.stars button.on{color:var(--coral)}
.avg{display:flex;align-items:baseline;gap:8px;margin-bottom:14px}
.avg b{font:500 2rem var(--f-mono)}

/* workspace */
.ws{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(18px,3vw,32px);align-items:start}
.panel{padding:clamp(16px,2.5vw,24px);border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.seg button{padding:.45rem 1rem;border-radius:8px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface-2);color:var(--fg)}
.pals{display:flex;gap:10px;flex-wrap:wrap}
.pal{display:flex;border-radius:999px;overflow:hidden;border:2px solid transparent;padding:2px}
.pal.on{border-color:var(--fg)}
.pal i{display:block;width:16px;height:22px}
.progress{height:6px;border-radius:999px;background:var(--bg);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--grad);transition:width .7s ease}
.prev{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.prev .tagline{position:absolute;left:10px;bottom:10px;padding:.2rem .55rem;border-radius:999px;background:rgba(14,14,16,.78);font-size:.75rem;color:var(--muted)}
.srow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.srow .st{width:64px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--bg)}
.srow .pr{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.srow input[type=number]{width:110px;padding:.5rem .6rem;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.srow input[type=checkbox]{width:18px;height:18px;accent-color:var(--violet)}
.srow h4{font:600 .95rem var(--f-body);letter-spacing:0;overflow-wrap:anywhere}

/* profile */
.phead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.bigav{width:76px;height:76px;border-radius:50%;background:var(--grad);color:#120d1c;display:grid;place-items:center;font:700 1.9rem var(--f-display)}
.phead h1{font-size:clamp(1.6rem,3.4vw,2.3rem)}
.chartcard{padding:clamp(16px,2.5vw,24px);border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-block:24px 34px;max-width:680px}
.chartcard .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.chartcard h2{font-size:1.15rem}
.chartcard svg{display:block;width:100%;height:auto}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:12px var(--f-mono)}
.ax-b{fill:var(--fg);font:600 12px var(--f-mono)}
.s1{stop-color:var(--violet)}.s2{stop-color:var(--pink)}.s3{stop-color:var(--coral)}

/* buy */
.buy{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(18px,3vw,32px);align-items:start}
.item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.item .st{width:96px;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--bg)}
.item h3{font:600 1rem var(--f-body);letter-spacing:0;overflow-wrap:anywhere}
.sum{display:flex;justify-content:space-between;gap:12px}
.sum.total{padding-top:12px;border-top:1px solid var(--line);font-weight:600;font-size:1.15rem}
.radio{display:flex;gap:10px;align-items:center;padding:.65rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.radio input{accent-color:var(--violet)}
.ok{color:var(--ok)}
.order{padding:.8rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem}

/* chat */
.chat{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:18px;align-items:start}
.cl{display:flex;flex-direction:column;gap:6px}
.cl button{display:flex;align-items:center;gap:10px;padding:.65rem .75rem;border-radius:12px;text-align:left;border:1px solid transparent}
.cl button:hover{background:var(--surface)}
.cl button.on{background:var(--surface);border-color:var(--line)}
.cl small{display:block;color:var(--muted)}
.cwin{display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-height:420px;min-width:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px;max-height:420px;overflow-y:auto}
.bub{max-width:80%;padding:.6rem .85rem;border-radius:14px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--violet);color:#0e0e10;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.typing{color:var(--muted);font-size:.85rem;align-self:flex-start}
.cform{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
.cform input{flex:1;min-width:0;padding:.65rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.call{position:fixed;inset:0;z-index:50;background:rgba(8,8,10,.86);backdrop-filter:blur(8px);display:grid;place-items:center;padding:var(--gutter)}
.callbox{width:min(100%,360px);padding:28px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.callbox .bigav{width:92px;height:92px;font-size:2.3rem}
.ring{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(139,92,246,.6)}100%{box-shadow:0 0 0 26px rgba(139,92,246,0)}}
.endcall{background:var(--err);color:#1b0b0b;border:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;padding:.7rem 1.1rem;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;max-width:calc(100% - 32px)}

.pal.auto{padding:2px 14px;align-items:center;font-size:.8rem;font-weight:600;color:var(--muted)}
.pal.auto.on{color:var(--fg)}
.otp{font-size:1.15rem;letter-spacing:.25em;color:var(--cyan)}
@media (max-width:820px){
  .hero,.detail,.ws,.buy,.chat{grid-template-columns:minmax(0,1fr)}
  .hero-art{order:-1}
  .hero-art img{width:min(60%,240px)}
}
@media (max-width:520px){
  .roles,.stepbox .opts{grid-template-columns:minmax(0,1fr)}
  .srow{grid-template-columns:56px minmax(0,1fr)}
  .srow .pr{grid-column:1/-1;justify-content:flex-start}
  .item{grid-template-columns:72px minmax(0,1fr)}
  .item .st{width:72px}
  .item .ip{grid-column:1/-1}
  .brand .word{height:28px}
  .brand .orb{width:34px}
}
@media (prefers-reduced-motion:reduce){
  .hero-art img,.ring{animation:none}
  .tile,.role,.btn{transition:none}
}
</style>

<header class="hdr"><div class="hdr-in" id="hdr"></div></header>
<main class="app" id="app"></main>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>

const PALETTES={aurora:['#7b8cff','#8b5cf6','#27d3ee','#ee7bc0'],ember:['#ff9a7a','#ee7bc0','#8b5cf6','#ffd166'],lagoon:['#27d3ee','#2dd4bf','#7b8cff','#a7f3d0'],orchid:['#ee7bc0','#8b5cf6','#c4b5fd','#fda4af'],dusk:['#6366f1','#f472b6','#fb923c','#38bdf8']};
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const MOTIFS={
 orbit(c,W,H,r,pal,t){
  const cx=W*(.42+r()*.16),cy=H*(.42+r()*.16),R=H*(.14+r()*.05);
  for(let i=0;i<3;i++){
   const rx=R*(2+i*.9+r()*.4),ry=R*(1.1+i*.55+r()*.3),rot=r()*Math.PI+t*.08*(i%2?1:-1);
   c.save();c.translate(cx,cy);c.rotate(rot);c.strokeStyle=pal[(i+1)%4]+'cc';c.lineWidth=W*.004;
   c.beginPath();c.ellipse(0,0,rx,ry,0,0,Math.PI*2);c.stroke();
   const a=r()*6.28+t*(.5+i*.2);c.fillStyle=pal[(i+2)%4];c.beginPath();c.arc(Math.cos(a)*rx,Math.sin(a)*ry,W*.014,0,6.28);c.fill();c.restore();
  }
  const g=c.createRadialGradient(cx-R*.35,cy-R*.4,R*.1,cx,cy,R);g.addColorStop(0,'#ffffff');g.addColorStop(.35,pal[3]);g.addColorStop(1,pal[1]);
  c.fillStyle=g;c.beginPath();c.arc(cx,cy,R,0,6.28);c.fill();
 },
 peaks(c,W,H,r,pal,t){
  const ph=[r()*6,r()*6,r()*6],sx=W*(.2+r()*.6),sy=H*(.25+r()*.1);
  const sg=c.createRadialGradient(sx,sy,0,sx,sy,H*.12);sg.addColorStop(0,pal[3]);sg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=sg;c.beginPath();c.arc(sx,sy,H*.12,0,6.28);c.fill();
  for(let l=0;l<4;l++){
   const base=H*(.5+l*.11),amp=H*(.16-l*.025);
   c.beginPath();c.moveTo(0,H);
   for(let x=0;x<=W;x+=8){
    const y=base-amp*(.6*Math.sin(x/W*(3+l)+ph[0]+l+t*.05)+.3*Math.sin(x/W*(7+l*2)+ph[1])+.1*Math.sin(x/W*19+ph[2]));
    c.lineTo(x,y);
   }
   c.lineTo(W,H);c.closePath();
   const g=c.createLinearGradient(0,base-amp,0,H);g.addColorStop(0,pal[l%4]+(l?'ee':'99'));g.addColorStop(1,'#0b0b0f');
   c.fillStyle=g;c.fill();
  }
 },
 geo(c,W,H,r,pal,t){
  const n=7+Math.floor(r()*4);
  for(let i=0;i<n;i++){
   const x=W*(.15+r()*.7),y=H*(.15+r()*.7),s=H*(.07+r()*.14),a=r()*6.28+t*(.1+i*.02)*(i%2?1:-1),col=pal[i%4],k=i%3;
   c.save();c.translate(x,y);c.rotate(a);c.lineWidth=W*.004;c.fillStyle=col+(k===0?'cc':'22');c.strokeStyle=col;c.beginPath();
   if(k===0)c.arc(0,0,s,0,6.28);
   else if(k===1)c.rect(-s,-s,s*2,s*2);
   else{c.moveTo(0,-s*1.15);c.lineTo(s,s*.8);c.lineTo(-s,s*.8);c.closePath();}
   c.fill();c.stroke();c.restore();
  }
 },
 spheres(c,W,H,r,pal,t){
  const fy=H*.78;c.fillStyle='rgba(255,255,255,0.05)';c.fillRect(0,fy,W,H-fy);
  const n=5+Math.floor(r()*3);
  for(let i=0;i<n;i++){
   const R=H*(.07+r()*.11),x=W*(.12+r()*.76),bob=Math.sin(t*1.2+i*1.3)*H*.015,y=fy-R*(1+r()*.9)+bob;
   c.fillStyle='rgba(0,0,0,0.35)';c.beginPath();c.ellipse(x,fy+R*.18,R*.95,R*.22,0,0,6.28);c.fill();
   const g=c.createRadialGradient(x-R*.35,y-R*.4,R*.08,x,y,R);g.addColorStop(0,'#fff');g.addColorStop(.3,pal[i%4]);g.addColorStop(1,'#14101f');
   c.fillStyle=g;c.beginPath();c.arc(x,y,R,0,6.28);c.fill();
  }
 }
};
function drawArt(cv,w,t){
 const c=cv.getContext('2d');if(!c)return;
 const W=cv.width,H=cv.height,r=rng(w.seed|0),pal=PALETTES[w.palette]||PALETTES.aurora;
 c.clearRect(0,0,W,H);c.fillStyle='#0b0b0f';c.fillRect(0,0,W,H);
 for(let i=0;i<4;i++){
  const x=r()*W+Math.sin(t*.5+i*2)*W*.04,y=r()*H+Math.cos(t*.4+i)*H*.05,rad=(.3+r()*.35)*W,col=pal[i%4];
  const g=c.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,col+'b3');g.addColorStop(1,col+'00');c.fillStyle=g;c.fillRect(0,0,W,H);
 }
 (MOTIFS[w.motif]||MOTIFS.orbit)(c,W,H,r,pal,t);
 const v=c.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,W*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.6)');
 c.fillStyle=v;c.fillRect(0,0,W,H);
}

}

async function hashPw(p,saltHex){
 if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
 const salt=saltHex?Uint8Array.from(saltHex.match(/../g).map(h=>parseInt(h,16))):crypto.getRandomValues(new Uint8Array(16));
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},key,256);
 return{salt:hex(salt),hash:hex(bits)};
}

async function seedShared(){
 const mk=Store.db.doc('meta/seed'),m=await mk.get();
 if(m.exists)return;
 const sd=seedData(),acc=await demoAccounts(),jobs=[];
 sd.creators.forEach(c=>jobs.push(['creators',c.id,c]));
 sd.works.forEach(w=>jobs.push(['works',w.id,w]));
 sd.reviews.forEach(r=>jobs.push(['reviews',r.id,r]));
 sd.comments.forEach(c=>jobs.push(['comments',c.id,c]));
 Object.keys(sd.sales).forEach(k=>jobs.push(['sales',k,sd.sales[k]]));
 acc.forEach(a=>jobs.push(['accounts',a.id,a]));
 for(let i=0;i<jobs.length;i+=4){await Promise.all(jobs.slice(i,i+4).map(j=>Store.db.doc(j[0]+'/'+j[1]).set(j[2])));}
 await mk.set({at:Date.now()});
}
function subscribe(db){
 const COLLS=['accounts','creators','works','reviews','comments','orders'];
 let pending=COLLS.length;
 const mark=()=>{if(--pending===0)ready();};
 COLLS.forEach(function(c){
  let seen=false;
  db.collection(c).onSnapshot(function(snap){
   DB[c]=snap.docs.map(d=>clone(d.data()));
   if(!seen&&!snap.metadata.fromCache){seen=true;mark();}
   else if(seen)onData();
  },function(){if(!seen){seen=true;mark();}});
 });
 db.collection('sales').onSnapshot(function(snap){const o={};snap.docs.forEach(d=>{o[d.id]=clone(d.data());});DB.sales=o;onData();},function(){});
 db.collection('chats').onSnapshot(function(snap){const o={};snap.docs.forEach(d=>{const m=clone(d.data()).messages;o[d.id]=Array.isArray(m)?m:[];});DB.chats=o;onData();},function(){});
 setTimeout(function(){ready(true);},8000);
}

/* profile */
function scale(v,int){
 if(v<=0)return{step:1,max:4};
 const p=Math.pow(10,Math.floor(Math.log10(v/5)));
 let step=[1,2,2.5,5,10,20].map(x=>x*p).find(s=>Math.ceil(v/s)<=5);
 if(int)step=Math.max(1,Math.ceil(step));
 return{step:step,max:step*Math.max(2,Math.ceil(v/step))};
}
const tickFmt=(v,m)=>m==='units'?String(v):'₹'+(v>=1000?(v/1000)+'k':v);
function chartSVG(vals,m){
 const W=480,H=260,L=48,R=10,T=24,B=30,iw=W-L-R,ih=H-T-B,mx=Math.max.apply(null,vals),sc=scale(mx,m==='units'),n=Math.round(sc.max/sc.step);
 const y=v=>T+ih-(v/sc.max)*ih;let grid='',bars='';
 for(let i=0;i<=n;i++){const v=i*sc.step;grid+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ax" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+tickFmt(v,m)+'</text>';}
 const slot=iw/vals.length,bw=slot*.56;
 vals.forEach((v,i)=>{
  const cx=L+slot*(i+.5),last=i===vals.length-1,h=T+ih-y(v);
  bars+='<rect x="'+(cx-bw/2)+'" y="'+y(v)+'" width="'+bw+'" height="'+h+'" rx="4" '+(last?'fill="url(#bg)"':'style="fill:var(--bar)"')+'/><text class="ax" x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+MON[i]+'</text>';
  if(last)bars+='<text class="ax-b" x="'+cx+'" y="'+(y(v)-7)+'" text-anchor="middle">'+(m==='units'?v:inr(v))+'</text>';
 });
 return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly '+(m==='units'?'units sold':'revenue')+' for the last 6 months"><defs><linearGradient id="bg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" class="s1"/><stop offset=".6" class="s2"/><stop offset="1" class="s3"/></linearGradient></defs>'+grid+bars+'</svg>';
}

}

const svgCache=new Map();
function svgUrl(w){const k=w.id+':'+hashStr(w.svg);let u=svgCache.get(k);if(!u){u='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(w.svg);svgCache.set(k,u);}return u;}
function cleanSvg(raw){
 if(!raw)return null;
 const a=raw.indexOf('<svg'),b=raw.lastIndexOf('</svg>');
 if(a<0||b<a)return null;
 const doc=new DOMParser().parseFromString(raw.slice(a,b+6),'image/svg+xml');
 if(doc.getElementsByTagName('parsererror').length)return null;
 const root=doc.documentElement;
 if(!root||root.localName!=='svg')return null;
 const BAD=['script','foreignobject','image','iframe','object','embed','audio','video','canvas','link','meta'];
 Array.from(root.getElementsByTagName('*')).forEach(function(el){
  const n=el.localName.toLowerCase();
  if(BAD.indexOf(n)>=0){el.remove();return;}
  if(n==='style'&&/@import|url\(\s*['"]?https?:/i.test(el.textContent)){el.remove();return;}
  Array.from(el.attributes).forEach(function(at){
   const an=at.name.toLowerCase();
   if(an.indexOf('on')===0){el.removeAttribute(at.name);return;}
   if((an==='href'||an==='xlink:href')&&at.value.trim().charAt(0)!=='#')el.removeAttribute(at.name);
  });
 });
 root.removeAttribute('width');root.removeAttribute('height');
 if(!root.getAttribute('viewBox'))root.setAttribute('viewBox','0 0 960 600');
 root.setAttribute('preserveAspectRatio','xMidYMid slice');
 root.setAttribute('xmlns','http://www.w3.org/2000/svg');
 const out=new XMLSerializer().serializeToString(root);
 return(out.length>150000||out.length<80)?null:out;
}
function buildPrompt(p,g){
 const hints=[];
 if(g.motif!=='auto')hints.push('Composition leaning: '+({orbit:'an orbital abstract with a central glowing sphere',peaks:'a layered landscape',geo:'bold geometric shapes, logo-like',spheres:'3D-looking objects on a floor with soft shadows'})[g.motif]+'.');
 if(g.palette!=='auto')hints.push('Colour palette: '+PALETTES[g.palette].join(', ')+'.');
 return[
  'You are an illustrator who draws with SVG code.',
  'Draw this as one SVG image: "'+p.replace(/"/g,"'")+'".',
  'The subject named in the description must be clearly recognisable. Add depth with layered shapes, gradients and soft lighting.',
  hints.join(' '),
  'Rules: reply with ONLY the SVG markup, starting with <svg and ending with </svg>, no code fences and no commentary. Use xmlns="http://www.w3.org/2000/svg" and viewBox="0 0 960 600" with no width or height attributes. Cover the whole canvas with a background. Do not use <script>, <foreignObject>, <image>, external links or web fonts. Include text only if the description asks for words. Keep it under 9000 characters.',
  g.kind==='video'?'Make it an animated loop: use SMIL (<animate>, <animateTransform>, <animateMotion>) with repeatCount="indefinite" so the main subject and the background move gently in a seamless loop of about 6 seconds.':'It is a still image, so do not animate anything.'
 ].filter(Boolean).join('\n');
}

function inferMotif(p){
 const s=p.toLowerCase();
 if(/mountain|hill|valley|landscape|sunset|sunrise|sky|coast|forest|river|lake|city|skyline|beach|desert/.test(s))return 'peaks';
 if(/logo|brand|mark|icon|monogram|pattern|geometric/.test(s))return 'geo';
 if(/product|bottle|shoe|sneaker|watch|3d|render|ball|object|toy|box/.test(s))return 'spheres';
 return 'orbit';
}
function inferPalette(p){
 const s=p.toLowerCase();
 if(/ocean|sea|water|rain|ice|teal|blue|lagoon|river|lake/.test(s))return 'lagoon';
 if(/sunset|fire|desert|warm|autumn|orange|ember|gold|sunrise/.test(s))return 'ember';
 if(/flower|pink|rose|candy|lantern|purple|orchid|blossom/.test(s))return 'orchid';
 if(/night|city|neon|dusk|twilight|cyber|moon/.test(s))return 'dusk';
 return 'aurora';
}

 if(t.id==='sort'){S.sort=t.value;refreshExplore();}
 else if(t.dataset&&t.dataset.sell){const p=$('#p_'+t.dataset.sell);p.disabled=!t.checked;if(t.checked)p.focus();}

});

function packImage(im){
 let max=960,q=.82;
 for(let i=0;i<6;i++){
  const sc=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(im.width*sc));cv.height=Math.max(1,Math.round(im.height*sc));
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
  const d=cv.toDataURL('image/jpeg',q);
  if(d.length<170000)return d;
  max=Math.round(max*.8);q=Math.max(.5,q-.08);
 }
 return null;
}
function previewFile(f){
 const box=$('#upPrev'),err=$('#uerr');S.pending=null;err.textContent='';
 if(!f){box.innerHTML='<span class="tagline">Choose a file to preview it</span>';return;}
 if(f.type.indexOf('video/')===0){
  const url=URL.createObjectURL(f);S.pending={kind:'video',videoUrl:url};
  box.innerHTML='<video class="art" src="'+url+'" controls muted playsinline></video>';
 }else if(f.type.indexOf('image/')===0){
  const fr=new FileReader();
  fr.onload=function(){
   const im=new Image();
   im.onload=function(){
    const data=packImage(im);
    if(!data){err.textContent='That image is too detailed to save. Try a smaller one.';return;}
    S.pending={kind:'image',img:data};
    box.innerHTML='<img class="art" alt="Selected file preview" src="'+data+'">';
   };
   im.onerror=function(){err.textContent='That image could not be read. Try a JPG or PNG.';};
   im.src=fr.result;
  };
  fr.readAsDataURL(f);
 }else{err.textContent='Choose an image or a video file.';}
}

/* forms */
const FORM={
 async auth(f){
  const err=$('#authErr'),v=id=>{const e=f.elements[id];return e?e.value.trim():'';};
  const username=v('username'),email=v('email'),pw=f.elements.password.value,role=S.role;
  const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  err.textContent='';
  if(!username||!email||!pw){err.textContent='Fill in every field to continue.';return;}
  if(!emailOk){err.textContent='Enter a valid email address, like you@example.com.';return;}
  if(!Store.ready){err.textContent='Still connecting to the marketplace. Try again in a moment.';return;}
  if(S.authMode==='login'){
   const a=DB.accounts.find(x=>x.role===role&&x.username.toLowerCase()===username.toLowerCase()&&x.email.toLowerCase()===email.toLowerCase());
   let ok=false;
   if(a){try{const h=await hashPw(pw,a.salt);ok=h.hash===a.hash;}catch(e){err.textContent='This browser cannot check passwords securely.';return;}}
   if(!ok){err.textContent='Username, email or password is incorrect. Check the details, reset your password, or create a new account.';return;}
   S.user=clone(a);S.stack=[];S.view='dash';S.params={};render();window.scrollTo(0,0);return;
  }
  if(!canSave())return;
  if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){err.textContent='Username needs 3 to 20 letters, numbers or underscores.';return;}
  if(DB.accounts.some(x=>x.username.toLowerCase()===username.toLowerCase())){err.textContent='That username is taken. Try another one.';return;}
  if(pw.length<6){err.textContent='Password needs at least 6 characters.';return;}
  if(pw!==f.elements.password2.value){err.textContent='The two passwords do not match.';return;}
  let cn='',ind='';
  if(role==='creator'){cn=v('creatorName');ind=v('industry');if(!cn||!ind){err.textContent='Add your creator name and choose an industry.';return;}}
  let h;try{h=await hashPw(pw);}catch(e){err.textContent='This browser cannot store passwords securely.';return;}
  const acct={id:'a'+uid(),role:role,username:username,email:email,salt:h.salt,hash:h.hash};
  if(role==='creator'){
   const c={id:'c'+uid(),name:cn,industry:ind,username:username,bio:ind+' creator on CreateHub.'};
   if(!(await put('creators',c)))return;
   DB.sales[c.id]={rev:[0,0,0,0,0,0],units:[0,0,0,0,0,0]};
   if(!(await putSales(c.id)))return;
   acct.creatorId=c.id;
  }
  if(!(await put('accounts',acct)))return;
  S.user=clone(acct);S.stack=[];S.view='dash';S.params={};render();window.scrollTo(0,0);toast('Account created');
 },
 async forgot(f){
  const err=$('#authErr'),fp=S.fp||(S.fp={step:1});err.textContent='';
  if(fp.step===1){
   const email=f.elements.email.value.trim().toLowerCase();
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Enter the email address on your account.';return;}
   if(!Store.ready){err.textContent='Still connecting to the marketplace. Try again in a moment.';return;}
   const a=DB.accounts.find(x=>x.role===S.role&&x.email.toLowerCase()===email);
   if(!a){err.textContent='No '+S.role+' account uses that email.';return;}
   S.fp={step:2,email:email,accountId:a.id,otp:makeOtp(),exp:Date.now()+600000,tries:0};render();
  }else if(fp.step===2){
   const code=f.elements.otp.value.trim();
   if(Date.now()>fp.exp){err.textContent='This code has expired. Generate a new one.';return;}
   if(fp.tries>=5){err.textContent='Too many wrong codes. Generate a new one.';return;}
   if(code!==fp.otp){fp.tries++;err.textContent='That code is not right.';return;}
   S.fp={step:3,accountId:fp.accountId};render();
  }else{
   const pw=f.elements.password.value;
   if(pw.length<6){err.textContent='Password needs at least 6 characters.';return;}
   if(pw!==f.elements.password2.value){err.textContent='The two passwords do not match.';return;}
   if(!canSave())return;
   const a=DB.accounts.find(x=>x.id===fp.accountId);
   if(!a){err.textContent='That account is no longer available.';return;}
   let h;try{h=await hashPw(pw);}catch(e){err.textContent='This browser cannot store passwords securely.';return;}
   if(!(await put('accounts',Object.assign({},a,{salt:h.salt,hash:h.hash}))))return;
   S.fp=null;S.authMode='login';render();toast('Password updated. Log in with your new password.');
  }
 },
 async review(f){
  const t=$('#rtext').value.trim(),err=$('#rerr');
  if(!S.rate){err.textContent='Choose a star rating first.';return;}
  if(!t){err.textContent='Write a short review.';return;}
  if(!canSave())return;
  if(!(await put('reviews',{id:'r'+uid(),workId:S.params.id,name:displayName(),rating:S.rate,text:t})))return;
  S.rate=0;render();toast('Review posted');
 },
 async comment(f){
  const t=$('#ctext').value.trim(),err=$('#cerr');
  if(!t){err.textContent='Write something first.';return;}
  if(!canSave())return;
  if(!(await put('comments',{id:'m'+uid(),workId:S.params.id,name:displayName(),text:t})))return;
  render();toast('Comment posted');
 },
 async checkout(f){
  if(!canSave())return;
  const items=S.cart.map(workById).filter(Boolean),sub=items.reduce((a,w)=>a+w.price,0),total=sub+Math.round(sub*.05),btn=$('#payBtn');
  btn.disabled=true;btn.textContent='Processing…';
  await new Promise(r=>setTimeout(r,1000));
  const o={id:'o'+uid(),ref:'CH-'+Math.floor(1000+Math.random()*9000),userId:S.user.id,total:total,at:Date.now(),items:items.map(w=>({id:w.id,title:w.title,price:w.price}))};
  if(!(await put('orders',o))){if(btn.isConnected){btn.disabled=false;btn.textContent='Buy for '+inr(total);}return;}
  for(const w of items){
   const s=DB.sales[w.creatorId]||(DB.sales[w.creatorId]={rev:[0,0,0,0,0,0],units:[0,0,0,0,0,0]});
   s.rev[5]+=w.price;s.units[5]+=1;await putSales(w.creatorId);
  }
  S.cart=[];S.view='buy';S.params={done:o.id};render();window.scrollTo(0,0);
 },
 async chat(f){
  const inp=$('#chatIn'),t=inp.value.trim();if(!t)return;
  if(!canSave())return;
  const cid=S.params.creatorId||DB.creators[0].id,k=threadKey(cid);
  if(!DB.chats[k])DB.chats[k]=[{from:'them',text:'Hi, thanks for stopping by. How can I help?'}];
  DB.chats[k].push({from:'me',text:t});inp.value='';S.typing=cid;
  updateChat();
  await putChat(k);
  clearTimeout(S.chatTimer);
  S.chatTimer=setTimeout(async function(){
   if(!DB.chats[k])DB.chats[k]=[];
   const n=DB.chats[k].filter(x=>x.from==='them').length;
   DB.chats[k].push({from:'them',text:REPLIES[n%REPLIES.length]});S.typing=null;
   if(S.view==='contact'&&(S.params.creatorId||DB.creators[0].id)===cid)updateChat();
   await putChat(k);
  },1300);
 },
 async generate(f){
  if(S.genBusy)return;
  const p=$('#prompt').value.trim(),err=$('#gerr'),g=S.gen;
  if(!p){err.textContent='Describe what you want to generate.';return;}
  err.textContent='';S.genBusy=true;S.genCtl=new AbortController();
  const ui=(id,fn)=>{const e=$('#'+id);if(e)fn(e);};
  const reset=()=>{S.genBusy=false;ui('genBtn',e=>{e.disabled=false;});ui('stopBtn',e=>{e.hidden=true;});ui('prog',e=>{e.hidden=true;});ui('progTxt',e=>{e.hidden=true;});};
  ui('genBtn',e=>{e.disabled=true;});ui('stopBtn',e=>{e.hidden=false;});ui('prog',e=>{e.hidden=false;});
  ui('progBar',e=>{e.style.width='6%';});ui('progTxt',e=>{e.hidden=false;e.textContent='Thinking…';});ui('gnote',e=>{e.textContent='';});
  g.prompt=p;
  let svg=null,note='';
  const sample=await cap('sample');
  if(sample){
   try{
    const res=await sample(buildPrompt(p,g),{signal:S.genCtl.signal,cache:false,onText:function(u){
     const pct=Math.min(94,8+Math.round(u.text.length/95));
     ui('progBar',e=>{e.style.width=pct+'%';});ui('progTxt',e=>{e.textContent='Drawing your scene…';});
    }});
    svg=cleanSvg(res.text);
    if(!svg)note='Claude’s drawing could not be read, so the demo renderer drew this instead.';
   }catch(e){
    if(e&&e.code==='cancelled'){reset();return;}
    note=sampleMsg(e&&e.code);
   }
  }else note='Claude drawing is not available in this view, so the demo renderer drew this instead.';
  g.ready=true;g.svg=svg;
  if(!svg){
   if(g.motif==='auto')g.motif=inferMotif(p);
   if(g.palette==='auto')g.palette=inferPalette(p);
   g.seed=hashStr(p+Date.now());
  }
  g.title=p.slice(0,48);
  reset();
  if(S.view==='create'){
   ui('prevBox',e=>{e.innerHTML=prevInner();});
   ui('saveBox',e=>{e.hidden=false;});
   ui('gtitle',e=>{e.value=g.title;});ui('gcat',e=>{e.value=defaultCat(g);});
   ui('gnote',e=>{e.textContent=note;});
   paintArts();
  }
 },
 async savegen(f){
  if(!canSave())return;
  const g=S.gen,title=$('#gtitle').value.trim()||g.prompt.slice(0,48)||'Untitled work';
  const w={id:'w'+uid(),n:Date.now(),creatorId:S.user.creatorId,title:title,kind:g.kind,cat:$('#gcat').value,motif:g.motif==='auto'?'orbit':g.motif,palette:g.palette==='auto'?'aurora':g.palette,seed:g.seed,price:null,desc:g.prompt};
  if(g.svg&&g.svg.length<=150000)w.svg=g.svg;
  if(!(await put('works',w)))return;
  toast('Saved to My Works');S.gen=null;go('sell');
 },
 async upload(f){
  const err=$('#uerr'),title=$('#utitle').value.trim();err.textContent='';
  if(!S.pending){err.textContent='Choose an image or video file first.';return;}
  if(!title){err.textContent='Give the work a title.';return;}
  if(!canSave())return;
  const w={id:'w'+uid(),n:Date.now(),creatorId:S.user.creatorId,title:title,kind:S.pending.kind,cat:$('#ucat').value,motif:'orbit',palette:'aurora',seed:hashStr(title),price:null,desc:$('#udesc').value.trim()||'Uploaded by the creator.'};
  if(S.pending.img)w.img=S.pending.img;
  if(S.pending.videoUrl){w.videoUrl=S.pending.videoUrl;w.upload='video';}
  const isVideo=!!S.pending.videoUrl;
  if(!(await put('works',w)))return;
  S.pending=null;render();toast(isVideo?'Added. Only this browser can play the video for now.':'Added to your profile');
 },
 async sell(f){
  const err=$('#serr');err.textContent='';
  const ws=worksOf(S.user.creatorId),next={};
  for(const w of ws){
   const cb=f.querySelector('[data-sell="'+w.id+'"]'),pi=$('#p_'+w.id);
   if(cb.checked){const v=Math.round(Number(pi.value));if(!(v>0)){err.textContent='Set a price above zero for "'+w.title+'".';pi.focus();return;}next[w.id]=v;}
   else next[w.id]=null;
  }
  if(!canSave())return;
  for(const w of ws){
   if(next[w.id]!==w.price){w.price=next[w.id];if(!(await put('works',w)))return;}
  }
  toast('Sale listings saved');
 }
};

/* call (demo screen only) */
function startCall(cid){
 const cr=creatorById(cid);
 $('#overlay').innerHTML='<div class="call" role="dialog" aria-modal="true" aria-label="Call with '+esc(cr.name)+'"><div class="callbox"><div class="bigav ring">'+esc(initials(cr.name))+'</div><h2 style="font-size:1.3rem">'+esc(cr.name)+'</h2><p class="muted" id="callSt" aria-live="polite">Calling…</p><button class="btn endcall" data-a="endcall">End call</button><p class="hint">Demo call screen. No audio connects in this prototype.</p></div></div>';
 let s=0;clearInterval(S.callTimer);
 setTimeout(function(){
  const st=$('#callSt');if(!st)return;
  st.textContent='Connected 0:00';
  S.callTimer=setInterval(function(){s++;const e=$('#callSt');if(!e){clearInterval(S.callTimer);return;}e.textContent='Connected '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},1000);
 },1800);
}
function endCall(){clearInterval(S.callTimer);$('#overlay').innerHTML='';}

/* ---------- init ---------- */
(async function init(){
 render();
 const db=await cap('db');
 if(db){
  Store.mode='shared';Store.db=db;S.conn='shared';
  const u=await cap('user');let cw=null;
  try{cw=u&&u.can?await u.can('data.write'):null;}catch(e){}
  if(cw===false)Store.canWrite=false;
  if(S.view==='landing')render();
  subscribe(db);
 }else await initLocal();
})();
})();
